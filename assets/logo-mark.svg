<svg xmlns="http://www.w3.org/2000/svg" viewBox="274 266 506 464" width="506" height="464">
  <!-- Calamo standalone mark (single color, inherits currentColor).
       Waveform notches and rachis are cut out via mask. The mask sits on an
       untransformed wrapper so mask and content share one coordinate space. -->
  <defs>
    <mask id="cuts">
      <rect x="274" y="266" width="506" height="464" fill="#FFFFFF"/>
      <g transform="rotate(45 512 512)" fill="none" stroke="#000000" stroke-linecap="round">
        <g stroke-width="30">
          <line x1="330" y1="275" x2="446" y2="275"/>
          <line x1="330" y1="352" x2="462" y2="352"/>
          <line x1="330" y1="429" x2="448" y2="429"/>
          <line x1="330" y1="506" x2="466" y2="506"/>
          <line x1="330" y1="583" x2="442" y2="583"/>
        </g>
        <path d="M 512 640 C 508 500 512 360 528 230" stroke-width="13"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#cuts)" fill="currentColor">
    <g transform="rotate(45 512 512)">
      <path d="M 540 185
        C 620 260 660 350 660 445
        C 660 540 590 615 532 650
        L 496 650
        C 445 610 390 535 388 445
        C 386 345 430 250 505 195 Z"/>
      <path d="M 496 638 L 532 638 L 522 790 L 496 812 Z"/>
    </g>
  </g>
</svg>
