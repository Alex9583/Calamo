# One dependency direction:
#   calamo-core (pure domain) ← calamo-adapters ← calamo-ffi (UniFFI staticlib)
[workspace]
resolver = "2"
members = ["calamo-core", "calamo-adapters", "calamo-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Mechanical backstop of docs/standards/small-units.md; threshold in clippy.toml.
[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
calamo-core = { path = "calamo-core" }
calamo-adapters = { path = "calamo-adapters" }
# pre-1.0: exact pin
uniffi = "=0.32.0"
strsim = "0.11.1"
# pre-1.0: exact pin; Metal is the only supported backend
llama-cpp-2 = { version = "=0.1.151", default-features = false, features = ["metal"] }
sha2 = "0.10"
ureq = "3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"

# llama.cpp at -O0 is unusable; keep the C/C++ optimized even in dev builds
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
