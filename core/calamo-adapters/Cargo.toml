[package]
name = "calamo-adapters"
version.workspace = true
edition.workspace = true

[features]
# Real CleanupPort adapter (macOS/Metal only). Off by default so the
# portable default-features CI build never compiles llama.cpp.
llama-cleanup = ["dep:llama-cpp-2"]

[dependencies]
calamo-core = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

# Runs only on the calibrated reference machine (real model + private corpus);
# the always-on cleanup_vectors_guard test keeps the vectors file honest in CI.
[[test]]
name = "cleanup_contract"
required-features = ["llama-cleanup"]

# On-demand golden suite (CALAMO_GOLDEN=1), same calibration constraints;
# golden_guard keeps its vectors and metrics honest in CI.
[[test]]
name = "cleanup_golden"
required-features = ["llama-cleanup"]

[lints]
workspace = true
